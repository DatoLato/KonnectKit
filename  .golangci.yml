run:
  timeout: 5m
  tests: true
  go: '1.21'  # Явно указываем версию Go для линтера

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  gofmt:
    simplify: true

  staticcheck:
    go: '1.21'  # Версия для статического анализа

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0