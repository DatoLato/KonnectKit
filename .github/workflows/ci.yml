name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'

jobs:
  # Проверка форматирования
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check gofmt
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "❌ Files not formatted:"
            gofmt -l .
            exit 1
          fi
          echo "✅ All files formatted correctly"

  # Проверка модулей
  mod:
    name: Check modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Verify modules
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ go mod tidy changed files"
            git diff
            exit 1
          fi
          echo "✅ Modules are tidy"

  # go vet (проверяет код, не требует тестов)
  vet:
    name: Go vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

  # Интеграционные тесты
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [fmt, mod, vet]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: go test -v -timeout 15m -tags=integration ./test/integration/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

  # Сборка примеров (проверяет, что код компилируется)
  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest
    needs: [fmt, mod, vet]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build examples
        run: |
          cd examples
          go build -v ./...