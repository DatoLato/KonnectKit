name: Release

on:
  push:
    tags:
      - 'v*'  # Триггер на теги вида v1.0.0, v2.1.3

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run tests before release
        run: go test -v -race ./...

      - name: Run integration tests
        run: go test -v -timeout 15m -tags=integration ./test/integration/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            README.md
            LICENSE